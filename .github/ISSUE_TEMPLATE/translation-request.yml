name: Translation request
description: Offer to add or review a language
labels: [translation]
body:
  - type: input
    id: locale
    attributes:
      label: Locale code
      description: For example `ja` or `pt-BR`
    validations:
      required: true
  - type: input
    id: language-name
    attributes:
      label: Language name
    validations:
      required: true
  - type: input
    id: reviewer-contact
    attributes:
      label: Translator and reviewer contact
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Contribution consent
      options:
        - label: I agree my translation is contributed under the project's license terms.
          required: true
